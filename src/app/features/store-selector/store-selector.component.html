<section class="store-selector">
  <div class="store-selector__content container">
    <form class="store-selector__wrapper-input-address">
      <div class="store-selector__form-content">
        <h2 class="store-selector__title-main">
          <span>Найди </span>
          <span>бутик около себя</span></h2>
        <p class="store-selector__text-main">Введите свой адрес и узнайте о самых ближайших бутиках к вам</p>
        <label for="store-selector-address" class="store-selector__label-address visually-hidden">Введите адрес</label>
        <div class="store-selector__wrapper-submit">
          <input id="store-selector-address" class="store-selector__input-address" type="text" autocomplete="street-address" placeholder="Введите адрес"/>
          <button class="store-selector__button-submit" type="submit" aria-label="Введите адрес"></button>
        </div>
      </div>
    </form>
      <app-map/>
  </div>
</section>
