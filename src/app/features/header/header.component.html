<header class="header-main" role="banner">
  <div class="header-main__content container">
    <div class="header-main__wrapper-header container">
      <a class="header-main__link-logo" href="#">
        <img
          [src]="isNavOpen() ? '../../../assets/images/vector/logo-light.svg' : '../../../assets/images/vector/logo-dark.svg'"
          width="258" height="53" alt="Логотип Moon River - ювелирные изделия">
      </a>

      <div class="header-main__wrapper-actions">
        <ul class="header-main__list-actions">
          <li class="header-main__item-action">
            <button class="button header-main__button-action">
              <svg width="23" height="20">
                <use href="./assets/images/vector/header-favorite-icon.svg#header-favorite"/>
              </svg>
            </button>
          </li>
          <li class="header-main__item-action">
            <button class="button header-main__button-action">
              <svg width="15" height="22">
                <use href="./assets/images/vector/header-account-icon.svg#header-main-account"/>
              </svg>
            </button>
          </li>
          <li matBadge="1" matBadgePosition="after" class="header-main__item-action">
            <button class="button header-main__button-action">
              <svg width="17" height="22">
                <use href="./assets/images/vector/header-cart-icon.svg#header-main-cart"/>
              </svg>
            </button>
          </li>
        </ul>
        <button appToggle (toggled)="toggleNav()" class="button header-main__button-burger"
                [class.nav-open]="isNavOpen()"
                aria-haspopup="true" aria-controls="header-main-navigation-overlay"
                [attr.aria-expanded]="isNavOpen()">
          <span [class]="(isNavOpen() ? 'header-main__line--top nav-open' : '') + ' header-main__line'"></span>
          <span [class]="(isNavOpen() ? 'header-main__line--middle nav-open' : '') + ' header-main__line'"></span>
          <span [class]="(isNavOpen() ? 'header-main__line--bottom nav-open' : '') + ' header-main__line'"></span>
        </button>
      </div>
    </div>

      <div id="header-main-navigation-overlay" class="header-main__navigation-overlay navigation-overlay"
           [class.open]="isNavOpen()"
           [attr.aria-hidden]="!isNavOpen()">
        <div class="header-main__wrapper-nav">
          <nav class="header-main__nav container">
            <ul class="header-main__list-nav">
              <li class="header-main__item-nav-link">
                <a class="header-main__link-nav" href="#">ювелирные изделия</a>
              </li>
              <li class="header-main__item-nav-link">
                <a class="header-main__link-nav" href="#">часы</a>
              </li>
              <li class="header-main__item-nav-link">
                <a class="header-main__link-nav" href="#">ароматы</a>
              </li>
              <li class="header-main__item-nav-link">
                <a class="header-main__link-nav" href="#">бренды</a>
              </li>
              <li class="header-main__item-nav-link">
                <a class="header-main__link-nav" href="#">изделия из кожи</a>
              </li>
              <li class="header-main__item-nav-link">
                <a class="header-main__link-nav">cвадебные украшения</a>
              </li>
              <li class="header-main__item-nav-link">
                <a class="header-main__link-nav">другое</a>
              </li>
            </ul>
          </nav>
        </div>

      </div>

  </div>
</header>
